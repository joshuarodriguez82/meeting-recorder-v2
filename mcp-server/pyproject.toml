[project]
name = "meeting-recorder-mcp"
version = "0.1.0"
description = "MCP server exposing the Meeting Recorder semantic index (meetings + Knowledge Folder documents) to Claude Desktop and Claude Code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Official Anthropic Python MCP SDK. 2.x renamed FastMCP -> MCPServer
    # and moved it to mcp.server.mcpserver; the code here targets that API.
    "mcp>=2.0.0,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
meeting-recorder-mcp = "meeting_recorder_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeting_recorder_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
