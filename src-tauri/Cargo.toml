[package]
name = "meeting-recorder"
version = "2.25.0"
description = "AI-powered meeting recorder, transcription, and summarizer"
authors = ["Joshua Rodriguez"]
license = "MIT"
repository = "https://github.com/joshuarodriguez82/meeting-recorder-v2"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
# HTTP client that runs in Rust, bypassing the WebView's CORS policy.
# Used by src/lib/updater.ts: api.github.com refuses the WebView's
# preflight from origin http://tauri.localhost even though it returns
# Access-Control-Allow-Origin: * on a plain `curl` GET. Rust's reqwest
# (which is what this plugin wraps) doesn't go through the WebView and
# doesn't care about CORS at all. The capability scope below restricts
# this to the one host the updater needs — the plugin won't proxy
# arbitrary URLs the WebView asks for.
tauri-plugin-http = "2"
# OS CSPRNG for the per-launch backend auth token (lib.rs::generate_backend_token).
# Lowest-level primitive available — already in the dependency tree via Tauri.
getrandom = "0.2"

# macOS-only deps for the EventKit calendar bridge. Python's pyobjc
# can't access EventKit reliably because the venv'd Python at
# ~/Library/Application Support/MeetingRecorder/.venv/bin/python3
# lives outside the .app bundle — macOS Tahoe TCC attributes by
# code-signing identity, so Python's TCC requests aren't recognized
# as part of com.joshuarodriguez.meeting-recorder and the user's
# calendar grant never applies. The Rust binary at
# Meeting Recorder.app/Contents/MacOS/meeting-recorder IS part of
# the bundle, so it can read calendar events directly. See
# src/calendar_macos.rs for the implementation; results are written
# to a JSON sidecar that Python reads.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSDate",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "block2",
] }
objc2-event-kit = { version = "0.3", features = [
    "EKEventStore",
    "EKEvent",
    "EKCalendar",
    "EKParticipant",
    "EKCalendarItem",
    "EKObject",
    "EKTypes",
    "block2",
] }
block2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "5"
