# Cross-platform release pipeline.
#
# Triggered by pushing a tag matching v*.*.* (e.g. `git tag v2.1.0 &&
# git push --tags`). For each platform in the matrix, builds a
# native-arch installer and uploads it to the corresponding GitHub
# Release. The release body is sourced from release-notes-vX.Y.Z.md if
# present in the repo root.
#
# Platforms:
#   - windows-latest   → NSIS .exe + MSI
#   - macos-14         → Apple Silicon (aarch64) .dmg
#   - macos-13         → Intel (x86_64) .dmg
#
# Mac builds are NOT signed or notarized. Recipients will need to
# right-click → Open the first time. To enable signing later, set
# bundle.macOS.signingIdentity in tauri.conf.json and add
# APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD secrets.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual trigger for dry-runs / re-running a failed build.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build from (e.g. v2.1.0)'
        required: false
        default: ''

permissions:
  # Required so the release-upload step can write the installers as
  # release assets. GITHUB_TOKEN is auto-provided by GitHub Actions.
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14            # Apple Silicon
            label: macos-arm64
          - platform: macos-13            # Intel
            label: macos-x64
          - platform: windows-latest
            label: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Python is needed only by zip-bundle.py (stdlib-only, fast). Stock
      # Python 3 on every GitHub runner suffices; setup-python pins
      # version + adds caching.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux runners would need libwebkit2gtk-4.1-dev / libgtk-3-dev /
      # libssl-dev / etc. — we don't build Linux here so skipping.

      - name: Install npm dependencies
        run: npm install

      - name: Build the app
        # `npx tauri build` runs `beforeBuildCommand` from tauri.conf.json,
        # which is `npm run tauri-prebuild` (next build + zip-bundle.py).
        # Tauri picks the right per-platform bundle targets automatically:
        # nsis + msi on Windows, dmg + app on Mac (because targets="all"
        # in tauri.conf.json).
        run: npx tauri build

      - name: Patch Info.plist (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/macos-postbuild.sh

      # The actual artifact paths differ by platform / bundler. Use a
      # matching glob and let the action upload whatever exists. Empty
      # globs would fail, but every platform always emits at least one
      # of these by the time we get here.
      - name: Collect installer paths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Collect installer paths (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        # Only attach to the release on tag-triggered runs. Manual
        # workflow_dispatch produces artifacts but doesn't publish.
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # release-notes-vX.Y.Z.md is the canonical body source per
          # this repo's convention. If the file is missing the action
          # falls back to GitHub's auto-generated notes.
          body_path: release-notes-${{ github.ref_name }}.md
          fail_on_unmatched_files: false
          files: artifacts/*
          # Mark unsigned Mac builds as a draft you can review before
          # publishing. Flip to `false` once you're confident in the
          # pipeline. (Drafts are still per-tag — re-runs update the
          # same draft, they don't pile up.)
          draft: true
          prerelease: false

      # Useful breadcrumbs in the run log if anything goes sideways —
      # particularly the Tauri / cargo build directory tree.
      - name: Debug — list bundle dir on failure
        if: failure()
        shell: bash
        run: |
          echo "--- src-tauri/target tree ---"
          find src-tauri/target -maxdepth 6 -name "bundle" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.dmg" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.exe" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.msi" -print 2>/dev/null || true
