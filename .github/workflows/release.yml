# Cross-platform release pipeline.
#
# Triggered by pushing a tag matching v*.*.* (e.g. `git tag v2.1.0 &&
# git push --tags`). Each matrix entry builds a native installer and
# uploads to the GitHub Release named after the tag. Body is sourced
# from release-notes-vX.Y.Z.md if present; otherwise GitHub's auto-
# generated notes win.
#
# Platforms:
#   - windows-latest   → NSIS .exe + MSI, native x64 only.
#   - macos-14         → universal-apple-darwin .dmg. ONE artifact runs
#                        on both Apple Silicon and Intel Macs because
#                        Tauri compiles + lipos both Rust targets into
#                        a fat binary inside the .app.
#
# We previously had a separate macos-13 (Intel) entry. That stopped
# working when GitHub deprecated free-tier `macos-13` runners — the
# job would silently fail to allocate while the other matrix entries
# happily published, so v2.1.0 only shipped Apple Silicon Mac. The
# universal2 path solves it on a single runner with no paid Intel
# image.
#
# Mac builds are NOT signed or notarized. Recipients use either
# System Settings → Privacy & Security → Open Anyway, or
# `xattr -cr "/Applications/Meeting Recorder.app"`. To enable signing
# later: set bundle.macOS.signingIdentity in tauri.conf.json + add
# APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD secrets.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual trigger for dry-runs / re-running a failed build.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build from (e.g. v2.1.0)'
        required: false
        default: ''

permissions:
  # Required so the release-upload step can write the installers as
  # release assets. GITHUB_TOKEN is auto-provided by GitHub Actions.
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runner builds a universal2 fat binary that
          # runs on both arm64 and x86_64 Macs. macos-13 (Intel) was
          # dropped after GitHub deprecated the free runner.
          #
          # We pass `--bundles app` to skip Tauri's DMG packaging step.
          # Tauri's bundle_dmg.sh chronically fails on macos-14 runners
          # (the AppleScript-against-Finder window-layout step gives up
          # in the headless CI environment with no useful error), so we
          # ship a ditto-zipped .app instead. Apple recommends ditto for
          # un-notarized distribution anyway because it preserves the
          # bundle's extended attributes and (future) code signature.
          - platform: macos-14
            label: macos-universal
            tauri-args: '--target universal-apple-darwin --bundles app'
            rust-targets: 'aarch64-apple-darwin x86_64-apple-darwin'
          - platform: windows-latest
            label: windows-x64
            tauri-args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Python is needed only by zip-bundle.py (stdlib-only, fast). Stock
      # Python 3 on every GitHub runner suffices; setup-python pins
      # version + adds caching.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Install both Mac targets when we're on a Mac runner so the
          # universal2 build can lipo them together. Empty string on
          # Windows leaves the toolchain at its default (msvc x64).
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux runners would need libwebkit2gtk-4.1-dev / libgtk-3-dev /
      # libssl-dev / etc. — we don't build Linux here so skipping.

      - name: Install npm dependencies
        run: npm install

      - name: Build the app
        # `npx tauri build` runs `beforeBuildCommand` from tauri.conf.json,
        # which is `npm run tauri-prebuild` (next build + zip-bundle.py).
        # On Mac we pass `--target universal-apple-darwin`; Tauri builds
        # both arm64 and x86_64 binaries, lipos them into one fat binary,
        # and produces a single .dmg. ~2 min slower than a native build.
        run: npx tauri build ${{ matrix.tauri-args }}

      - name: Patch Info.plist (macOS)
        if: runner.os == 'macOS'
        # The script walks src-tauri/target recursively, so it picks up
        # the .app at target/universal-apple-darwin/release/bundle/macos/
        # without needing any path tweaks here.
        run: ./scripts/macos-postbuild.sh

      - name: Collect installer paths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Collect installer paths (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          # `--bundles app` drops the .app under bundle/macos/. We
          # ditto-zip it ourselves (preserves macOS extended attrs +
          # any future code signature; plain `zip` does not).
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Meeting Recorder.app"
          if [ ! -d "$APP" ]; then
            # Native-target fallback in case --target is ever dropped.
            APP="src-tauri/target/release/bundle/macos/Meeting Recorder.app"
          fi
          if [ ! -d "$APP" ]; then
            echo "ERROR: no Meeting Recorder.app under expected paths" >&2
            exit 1
          fi
          # Strip leading 'v' from the tag (v2.3.2 -> 2.3.2) so the
          # filename matches the Windows installer convention. On a
          # workflow_dispatch run from a branch, GITHUB_REF_NAME is the
          # branch name; the resulting filename is ugly but the upload
          # step is gated on refs/tags/v* anyway so it never publishes.
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="artifacts/Meeting.Recorder_${VERSION}_universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          ls -la artifacts/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        # Only attach to the release on tag-triggered runs. Manual
        # workflow_dispatch produces artifacts but doesn't publish.
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # release-notes-vX.Y.Z.md is the canonical body source per
          # this repo's convention. If the file is missing the action
          # falls back to GitHub's auto-generated notes.
          body_path: release-notes-${{ github.ref_name }}.md
          fail_on_unmatched_files: false
          files: artifacts/*
          # Auto-publish on tag push. Pipeline has been steady and the
          # manual review step was just adding friction. Flip back to
          # `true` if a future bad build slips through and we want a
          # gate again.
          draft: false
          prerelease: false

      # Useful breadcrumbs in the run log if anything goes sideways —
      # particularly the Tauri / cargo build directory tree.
      - name: Debug — list bundle dir on failure
        if: failure()
        shell: bash
        run: |
          echo "--- src-tauri/target tree ---"
          find src-tauri/target -maxdepth 6 -name "bundle" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.app" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.zip" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.exe" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.msi" -print 2>/dev/null || true
