# Cross-platform release pipeline.
#
# Triggered by pushing a tag matching v*.*.* (e.g. `git tag v2.1.0 &&
# git push --tags`). Each matrix entry builds a native installer and
# uploads to the GitHub Release named after the tag. Body is sourced
# from release-notes-vX.Y.Z.md if present; otherwise GitHub's auto-
# generated notes win.
#
# Platforms:
#   - windows-latest   → NSIS .exe + MSI, native x64 only.
#   - macos-14         → universal-apple-darwin .dmg. ONE artifact runs
#                        on both Apple Silicon and Intel Macs because
#                        Tauri compiles + lipos both Rust targets into
#                        a fat binary inside the .app.
#
# We previously had a separate macos-13 (Intel) entry. That stopped
# working when GitHub deprecated free-tier `macos-13` runners — the
# job would silently fail to allocate while the other matrix entries
# happily published, so v2.1.0 only shipped Apple Silicon Mac. The
# universal2 path solves it on a single runner with no paid Intel
# image.
#
# Mac builds are NOT signed or notarized. Recipients use either
# System Settings → Privacy & Security → Open Anyway, or
# `xattr -cr "/Applications/Meeting Recorder.app"`. To enable signing
# later: set bundle.macOS.signingIdentity in tauri.conf.json + add
# APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD secrets.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual trigger for dry-runs / re-running a failed build.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build from (e.g. v2.1.0)'
        required: false
        default: ''

permissions:
  # Required so the release-upload step can write the installers as
  # release assets. GITHUB_TOKEN is auto-provided by GitHub Actions.
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runner builds a universal2 fat binary that
          # runs on both arm64 and x86_64 Macs. macos-13 (Intel) was
          # dropped after GitHub deprecated the free runner.
          #
          # We pass `--bundles app` to skip Tauri's DMG packaging step.
          # Tauri's bundle_dmg.sh chronically fails on macos-14 runners
          # (the AppleScript-against-Finder window-layout step gives up
          # in the headless CI environment with no useful error), so we
          # ship a ditto-zipped .app instead. Apple recommends ditto for
          # un-notarized distribution anyway because it preserves the
          # bundle's extended attributes and (future) code signature.
          - platform: macos-14
            label: macos-universal
            tauri-args: '--target universal-apple-darwin --bundles app'
            rust-targets: 'aarch64-apple-darwin x86_64-apple-darwin'
          - platform: windows-latest
            label: windows-x64
            tauri-args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Python is needed only by zip-bundle.py (stdlib-only, fast). Stock
      # Python 3 on every GitHub runner suffices; setup-python pins
      # version + adds caching.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Install both Mac targets when we're on a Mac runner so the
          # universal2 build can lipo them together. Empty string on
          # Windows leaves the toolchain at its default (msvc x64).
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux runners would need libwebkit2gtk-4.1-dev / libgtk-3-dev /
      # libssl-dev / etc. — we don't build Linux here so skipping.

      - name: Install npm dependencies
        run: npm install

      - name: Build the app
        # `npx tauri build` runs `beforeBuildCommand` from tauri.conf.json,
        # which is `npm run tauri-prebuild` (next build + zip-bundle.py).
        # On Mac we pass `--target universal-apple-darwin`; Tauri builds
        # both arm64 and x86_64 binaries, lipos them into one fat binary,
        # and produces a single .dmg. ~2 min slower than a native build.
        run: npx tauri build ${{ matrix.tauri-args }}

      - name: Patch Info.plist (macOS)
        if: runner.os == 'macOS'
        # The script walks src-tauri/target recursively, so it picks up
        # the .app at target/universal-apple-darwin/release/bundle/macos/
        # without needing any path tweaks here.
        run: ./scripts/macos-postbuild.sh

      - name: Codesign with stable identifier-based DR (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # Ad-hoc sign the .app with a Designated Requirement that
        # matches by bundle identifier instead of cdhash. Without this,
        # every unsigned build has a fresh cdhash and macOS Tahoe TCC
        # silently invalidates the user's previously-granted Calendar /
        # Mic / AppleEvents permissions on every update — the toggle
        # in System Settings stays on, but authorizationStatusForEntityType
        # returns NotDetermined because the recorded cdhash doesn't
        # match the running binary.
        #
        # The custom requirement string tells codesign to embed
        # "identifier == com.joshuarodriguez.meeting-recorder" as the
        # Designated Requirement. TCC then uses bundle identity, not
        # cdhash, when matching grants — so a user who grants permission
        # on v2.3.5 still has it after upgrading to v2.3.6, v2.4.0, etc.
        #
        # This is still an ad-hoc signature (no Apple Developer cert,
        # no notarization). Users still get the "damaged" Gatekeeper
        # warning on first launch and need the xattr -cr workaround.
        # Signing only fixes the TCC drift; doesn't bypass Gatekeeper.
        # When we eventually buy a Developer cert, this step gets
        # replaced with `--sign "Developer ID Application: ..."`.
        run: |
          set -e
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Meeting Recorder.app"
          if [ ! -d "$APP" ]; then
            APP="src-tauri/target/release/bundle/macos/Meeting Recorder.app"
          fi
          if [ ! -d "$APP" ]; then
            echo "ERROR: no Meeting Recorder.app under expected paths" >&2
            exit 1
          fi
          codesign --force --deep --sign - \
            --identifier com.joshuarodriguez.meeting-recorder \
            --requirements '=designated => identifier "com.joshuarodriguez.meeting-recorder"' \
            "$APP"
          # Print the resulting DR so a future regression to
          # cdhash-based matching is obvious in the CI log.
          echo "--- Designated Requirement on signed app ---"
          codesign -d -r- "$APP" 2>&1 | grep -i designated || true

      - name: Collect installer paths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Collect installer paths (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          # `--bundles app` drops the .app under bundle/macos/. We
          # ditto-zip it ourselves (preserves macOS extended attrs +
          # any future code signature; plain `zip` does not).
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Meeting Recorder.app"
          if [ ! -d "$APP" ]; then
            # Native-target fallback in case --target is ever dropped.
            APP="src-tauri/target/release/bundle/macos/Meeting Recorder.app"
          fi
          if [ ! -d "$APP" ]; then
            echo "ERROR: no Meeting Recorder.app under expected paths" >&2
            exit 1
          fi
          # Strip leading 'v' from the tag (v2.3.2 -> 2.3.2) so the
          # filename matches the Windows installer convention. On a
          # workflow_dispatch run from a branch, GITHUB_REF_NAME is the
          # branch name; the resulting filename is ugly but the upload
          # step is gated on refs/tags/v* anyway so it never publishes.
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="artifacts/Meeting.Recorder_${VERSION}_universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          ls -la artifacts/

      # Sign each installer with the Tauri updater's minisign key so
      # the in-app updater can verify downloads before installing them.
      # Skips silently if TAURI_SIGNING_PRIVATE_KEY isn't configured —
      # the build still produces installable artifacts; the updater
      # just stays inert until the secret is set on the repo.
      - name: Sign artifacts for updater
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is not set — skipping updater signing."
            echo "Set the secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) to enable in-app updates."
            exit 0
          fi
          set -e
          for f in artifacts/*; do
            case "$f" in
              *.sig) continue ;;
              *.exe|*.msi|*.zip)
                echo "Signing $f"
                npx --yes tauri signer sign "$f"
                ;;
            esac
          done
          echo "--- artifacts/ after signing ---"
          ls -la artifacts/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        # Only attach to the release on tag-triggered runs. Manual
        # workflow_dispatch produces artifacts but doesn't publish.
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # release-notes-vX.Y.Z.md is the canonical body source per
          # this repo's convention. If the file is missing the action
          # falls back to GitHub's auto-generated notes.
          body_path: release-notes-${{ github.ref_name }}.md
          fail_on_unmatched_files: false
          # `artifacts/*` picks up the installer AND its .sig file from
          # the signing step above — both get attached to the release
          # so the manifest job below can consume the .sig contents.
          files: artifacts/*
          # Auto-publish on tag push. Pipeline has been steady and the
          # manual review step was just adding friction. Flip back to
          # `true` if a future bad build slips through and we want a
          # gate again.
          draft: false
          prerelease: false

      # Useful breadcrumbs in the run log if anything goes sideways —
      # particularly the Tauri / cargo build directory tree.
      - name: Debug — list bundle dir on failure
        if: failure()
        shell: bash
        run: |
          echo "--- src-tauri/target tree ---"
          find src-tauri/target -maxdepth 6 -name "bundle" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.app" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.zip" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.exe" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.msi" -print 2>/dev/null || true

  # After both platform builds finish and upload their signed artifacts
  # to the release, consolidate the per-platform .sig files into a
  # single latest.json manifest that the Tauri updater reads at
  # check-for-updates time. The manifest URL is hardcoded in
  # tauri.conf.json: github.com/.../releases/latest/download/latest.json
  # which always redirects to the newest release's latest.json.
  manifest:
    name: Build updater manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e
          VERSION="${TAG#v}"

          # Pull the .sig files that the build job just attached to the
          # release. If signing was skipped (secret not set), there
          # won't be any .sig files and this job exits without
          # publishing latest.json — the updater stays inert, the
          # release still installs fine via direct download.
          mkdir -p sigs
          gh release download "$TAG" -p "*.sig" --dir sigs || true
          if [ -z "$(ls -A sigs 2>/dev/null)" ]; then
            echo "No .sig files in release — signing was skipped."
            echo "Skipping latest.json publication."
            exit 0
          fi

          read_sig() {
            local f="sigs/$1"
            if [ -f "$f" ]; then cat "$f"; else echo ""; fi
          }

          NOTES="$(head -c 2000 "release-notes-${TAG}.md" 2>/dev/null || echo '')"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BASE="https://github.com/joshuarodriguez82/meeting-recorder-v2/releases/download/${TAG}"

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg win_sig "$(read_sig Meeting.Recorder_${VERSION}_x64-setup.exe.sig)" \
            --arg win_url "${BASE}/Meeting.Recorder_${VERSION}_x64-setup.exe" \
            --arg mac_sig "$(read_sig Meeting.Recorder_${VERSION}_universal.zip.sig)" \
            --arg mac_url "${BASE}/Meeting.Recorder_${VERSION}_universal.zip" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "darwin-x86_64":  { signature: $mac_sig, url: $mac_url }
              }
            }' > latest.json

          echo "--- latest.json ---"
          cat latest.json

          gh release upload "$TAG" latest.json --clobber
