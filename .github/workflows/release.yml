# Cross-platform release pipeline.
#
# Two ways to trigger:
#   1. Push a tag matching v*.*.* (legacy path) — `git tag v2.1.0 &&
#      git push --tags`. Tag SHA must match a commit whose
#      tauri.conf.json declares the same version, or `verify-version`
#      bails (v2.7.5–v2.7.7 stale-tag guard).
#   2. `workflow_dispatch` — fire from the GitHub UI or via the API
#      (`actions_run_trigger` from a Claude Code session). Reads
#      tauri.conf.json on the current ref (default `main`), derives
#      the tag name from that, atomically creates-or-moves the tag at
#      the current SHA via the REST API, then runs the build matrix
#      and publishes. This is the path that avoids the "publish
#      before merge" trap — once the bump PR is merged, the dispatch
#      tags + builds + publishes in one shot, no manual git tag dance.
#
# Each matrix entry builds a native installer and uploads to the
# GitHub Release named after the tag. Body is sourced from
# docs/release-notes/release-notes-vX.Y.Z.md if present; otherwise
# GitHub's auto-generated notes win.
#
# Platforms:
#   - windows-latest   → NSIS .exe + MSI, native x64 only.
#   - macos-14         → universal-apple-darwin .dmg. ONE artifact runs
#                        on both Apple Silicon and Intel Macs because
#                        Tauri compiles + lipos both Rust targets into
#                        a fat binary inside the .app.
#
# We previously had a separate macos-13 (Intel) entry. That stopped
# working when GitHub deprecated free-tier `macos-13` runners — the
# job would silently fail to allocate while the other matrix entries
# happily published, so v2.1.0 only shipped Apple Silicon Mac. The
# universal2 path solves it on a single runner with no paid Intel
# image.
#
# Mac builds are NOT signed or notarized. Recipients use either
# System Settings → Privacy & Security → Open Anyway, or
# `xattr -cr "/Applications/Meeting Recorder.app"`. To enable signing
# later: set bundle.macOS.signingIdentity in tauri.conf.json + add
# APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD secrets.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Two-purpose manual trigger.
  #   - publish=true (default): create-or-move the tag at the
  #     currently-checked-out SHA, then build + publish a release.
  #   - publish=false: build artifacts only (test build off a branch),
  #     no tag mutation, no release.
  # `tag` input is optional; if blank we derive `v<tauri.conf.json.version>`
  # so the typical flow ("merge the version-bump PR, then fire") needs
  # no inputs at all.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (blank = derive from tauri.conf.json.version, prefixed with v)'
        required: false
        default: ''
      publish:
        description: 'Create/move the tag and publish a release (uncheck for an artifact-only test build)'
        required: false
        default: true
        type: boolean

permissions:
  # contents:write lets the release-upload step write installer assets
  # AND lets the prepare job atomically create/move the tag via the
  # git/refs API. GITHUB_TOKEN is auto-provided by GitHub Actions.
  contents: write

jobs:
  # Fail-fast gate for the v2.7.5/2.7.6/2.7.7 class of bug: three
  # releases in a row tagged the same stale commit, so every artifact
  # was built from old code while the release page claimed a new
  # version. The tag-driven workflow trusted the tag blindly. This job
  # verifies the tagged TREE actually carries the version the tag
  # claims — if tauri.conf.json.version != the tag (leading `v`
  # stripped), nothing builds and the mismatch is named in the log.
  # On workflow_dispatch, this ALSO creates/moves the tag at the
  # current SHA when `publish=true`, eliminating the manual `git tag -f`
  # step that used to be required after the version-bump PR merged.
  # Runs in seconds on the cheapest runner; the build matrix only
  # starts after it passes.
  prepare:
    name: Compute tag · verify version · (dispatch) move tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      publish: ${{ steps.compute.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compute tag and publish flag
        id: compute
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push — github.ref_name is the tag; publishing is the
            # whole point of pushing a tag.
            TAG="${GITHUB_REF_NAME}"
            PUBLISH="true"
          else
            if [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
            else
              # Derive from tauri.conf.json so the dispatch needs zero
              # inputs in the common case (just merged the bump PR).
              VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
              TAG="v${VERSION}"
            fi
            PUBLISH="${INPUT_PUBLISH}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Computed tag=$TAG  publish=$PUBLISH"
      - name: Verify tag matches tauri.conf.json
        shell: bash
        env:
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          CONF_VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          TAG_VERSION="${TAG#v}"
          echo "tag=$TAG → expected version=$TAG_VERSION"
          echo "tauri.conf.json version=$CONF_VERSION (at $GITHUB_SHA)"
          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=src-tauri/tauri.conf.json::Tag $TAG points at a tree whose tauri.conf.json says $CONF_VERSION. Either bump tauri.conf.json on this ref first, or re-fire workflow_dispatch with input tag=v$CONF_VERSION."
            exit 1
          fi
          echo "Version gate passed."
      - name: Create or move tag at current SHA (workflow_dispatch + publish)
        if: github.event_name == 'workflow_dispatch' && steps.compute.outputs.publish == 'true'
        shell: bash
        env:
          # GITHUB_TOKEN has contents:write per `permissions:` above —
          # enough for git/refs writes. No PAT or external secret
          # needed; this is the whole point of the workflow_dispatch
          # path replacing the manual `git tag -f` step.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          set -e
          REPO="${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA}"
          API="https://api.github.com/repos/${REPO}/git/refs"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          # Probe the tag. 200 → exists (move it); 404 → create it.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "$AUTH" "${API}/tags/${TAG}")
          if [ "$STATUS" = "200" ]; then
            echo "Tag $TAG exists; moving to $SHA"
            curl -sfL -X PATCH \
              -H "$AUTH" -H "$ACCEPT" \
              "${API}/tags/${TAG}" \
              -d "{\"sha\":\"${SHA}\",\"force\":true}" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('moved →', r.get('object',{}).get('sha',''))"
          elif [ "$STATUS" = "404" ]; then
            echo "Tag $TAG does not exist; creating at $SHA"
            curl -sfL -X POST \
              -H "$AUTH" -H "$ACCEPT" \
              "${API}" \
              -d "{\"ref\":\"refs/tags/${TAG}\",\"sha\":\"${SHA}\"}" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('created →', r.get('object',{}).get('sha',''))"
          else
            echo "::error::Unexpected status $STATUS probing tag $TAG; aborting."
            exit 1
          fi

  build:
    name: Build (${{ matrix.label }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runner builds a universal2 fat binary that
          # runs on both arm64 and x86_64 Macs. macos-13 (Intel) was
          # dropped after GitHub deprecated the free runner.
          #
          # We pass `--bundles app` to skip Tauri's DMG packaging step.
          # Tauri's bundle_dmg.sh chronically fails on macos-14 runners
          # (the AppleScript-against-Finder window-layout step gives up
          # in the headless CI environment with no useful error), so we
          # ship a ditto-zipped .app instead. Apple recommends ditto for
          # un-notarized distribution anyway because it preserves the
          # bundle's extended attributes and (future) code signature.
          - platform: macos-14
            label: macos-universal
            tauri-args: '--target universal-apple-darwin --bundles app'
            rust-targets: 'aarch64-apple-darwin x86_64-apple-darwin'
          - platform: windows-latest
            label: windows-x64
            tauri-args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Python is needed only by zip-bundle.py (stdlib-only, fast). Stock
      # Python 3 on every GitHub runner suffices; setup-python pins
      # version + adds caching.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Install both Mac targets when we're on a Mac runner so the
          # universal2 build can lipo them together. Empty string on
          # Windows leaves the toolchain at its default (msvc x64).
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux runners would need libwebkit2gtk-4.1-dev / libgtk-3-dev /
      # libssl-dev / etc. — we don't build Linux here so skipping.

      - name: Install npm dependencies
        run: npm install

      - name: Build the app
        # `npx tauri build` runs `beforeBuildCommand` from tauri.conf.json,
        # which is `npm run tauri-prebuild` (next build + zip-bundle.py).
        # On Mac we pass `--target universal-apple-darwin`; Tauri builds
        # both arm64 and x86_64 binaries, lipos them into one fat binary,
        # and produces a single .dmg. ~2 min slower than a native build.
        run: npx tauri build ${{ matrix.tauri-args }}

      - name: Patch Info.plist (macOS)
        if: runner.os == 'macOS'
        # The script walks src-tauri/target recursively, so it picks up
        # the .app at target/universal-apple-darwin/release/bundle/macos/
        # without needing any path tweaks here.
        run: ./scripts/macos-postbuild.sh

      - name: Codesign with stable identifier-based DR (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # Ad-hoc sign the .app with a Designated Requirement that
        # matches by bundle identifier instead of cdhash. Without this,
        # every unsigned build has a fresh cdhash and macOS Tahoe TCC
        # silently invalidates the user's previously-granted Calendar /
        # Mic / AppleEvents permissions on every update — the toggle
        # in System Settings stays on, but authorizationStatusForEntityType
        # returns NotDetermined because the recorded cdhash doesn't
        # match the running binary.
        #
        # The custom requirement string tells codesign to embed
        # "identifier == com.joshuarodriguez.meeting-recorder" as the
        # Designated Requirement. TCC then uses bundle identity, not
        # cdhash, when matching grants — so a user who grants permission
        # on v2.3.5 still has it after upgrading to v2.3.6, v2.4.0, etc.
        #
        # This is still an ad-hoc signature (no Apple Developer cert,
        # no notarization). Users still get the "damaged" Gatekeeper
        # warning on first launch and need the xattr -cr workaround.
        # Signing only fixes the TCC drift; doesn't bypass Gatekeeper.
        # When we eventually buy a Developer cert, this step gets
        # replaced with `--sign "Developer ID Application: ..."`.
        run: |
          set -e
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Meeting Recorder.app"
          if [ ! -d "$APP" ]; then
            APP="src-tauri/target/release/bundle/macos/Meeting Recorder.app"
          fi
          if [ ! -d "$APP" ]; then
            echo "ERROR: no Meeting Recorder.app under expected paths" >&2
            exit 1
          fi
          codesign --force --deep --sign - \
            --identifier com.joshuarodriguez.meeting-recorder \
            --requirements '=designated => identifier "com.joshuarodriguez.meeting-recorder"' \
            "$APP"
          # Print the resulting DR so a future regression to
          # cdhash-based matching is obvious in the CI log.
          echo "--- Designated Requirement on signed app ---"
          codesign -d -r- "$APP" 2>&1 | grep -i designated || true

      - name: Collect installer paths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Bundle Chrome extension (Windows only — Mac users get the
              same zip from the Windows artifact)
        if: runner.os == 'Windows'
        shell: pwsh
        # v2.16+: ship the Chrome extension (chrome-extension/ at repo
        # root) as its own zip alongside the .exe and .msi. Users
        # download, extract, then "Load unpacked" in chrome://extensions.
        # See backend/server.py:/briefing/extension-import for the
        # receiving endpoint and src/components/settings-view.tsx:
        # ChromeExtensionCard for the user-facing setup UI.
        run: |
          if (Test-Path chrome-extension) {
            Compress-Archive -Path chrome-extension\* -DestinationPath artifacts\chrome-extension.zip -Force
            Write-Host "Created artifacts\chrome-extension.zip"
            Get-ChildItem artifacts
          } else {
            Write-Host "chrome-extension dir not found at repo root — skipping"
          }

      - name: Collect installer paths (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          # prepare.outputs.tag works for BOTH triggers: on tag push
          # it equals GITHUB_REF_NAME; on workflow_dispatch it's the
          # derived "v<version>" so we don't end up with branch names
          # like "main" in the artifact filename.
          BUILD_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -e
          mkdir -p artifacts
          # `--bundles app` drops the .app under bundle/macos/. We
          # ditto-zip it ourselves (preserves macOS extended attrs +
          # any future code signature; plain `zip` does not).
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Meeting Recorder.app"
          if [ ! -d "$APP" ]; then
            # Native-target fallback in case --target is ever dropped.
            APP="src-tauri/target/release/bundle/macos/Meeting Recorder.app"
          fi
          if [ ! -d "$APP" ]; then
            echo "ERROR: no Meeting Recorder.app under expected paths" >&2
            exit 1
          fi
          # Strip leading 'v' from the prepare-computed tag (v2.3.2 ->
          # 2.3.2) so the filename matches the Windows installer
          # convention regardless of which trigger fired.
          VERSION="${BUILD_TAG#v}"
          OUT="artifacts/Meeting.Recorder_${VERSION}_universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          ls -la artifacts/

      # Upload built installers as workflow artifacts on EVERY run
      # (tag push + manual dispatch). Lets us grab a test build off a
      # branch via `gh run download <id>` without cutting a real tag.
      # Tag-triggered runs ALSO publish to GitHub Releases below.
      - name: Upload installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        # Publish on tag pushes AND on workflow_dispatch runs that
        # opted in (publish=true). When the prepare job moved the tag
        # for us, the action attaches to that tag's release; when this
        # is a tag-push event, it attaches to the existing release.
        if: |
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && needs.prepare.outputs.publish == 'true')
        with:
          # Pin the release to prepare's computed tag rather than
          # GITHUB_REF_NAME — the dispatch path's ref is a branch, not
          # a tag.
          tag_name: ${{ needs.prepare.outputs.tag }}
          # docs/release-notes/release-notes-vX.Y.Z.md is the canonical
          # body source per this repo's convention. If the file is
          # missing the action falls back to GitHub's auto-generated
          # notes.
          body_path: docs/release-notes/release-notes-${{ needs.prepare.outputs.tag }}.md
          fail_on_unmatched_files: false
          files: artifacts/*
          # Auto-publish. Pipeline has been steady and the manual
          # review step was just adding friction. Flip back to `true`
          # if a future bad build slips through and we want a gate
          # again.
          draft: false
          prerelease: false

      # Useful breadcrumbs in the run log if anything goes sideways —
      # particularly the Tauri / cargo build directory tree.
      - name: Debug — list bundle dir on failure
        if: failure()
        shell: bash
        run: |
          echo "--- src-tauri/target tree ---"
          find src-tauri/target -maxdepth 6 -name "bundle" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.app" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.zip" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.exe" -print 2>/dev/null || true
          find src-tauri/target -maxdepth 8 -name "*.msi" -print 2>/dev/null || true
