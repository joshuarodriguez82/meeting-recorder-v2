# Resolve each platform's requirements file on the OS it actually
# targets and emit the full transitive pin set (`pip freeze`) as both a
# job-log block and an artifact.
#
# Why this exists: the bootstrap pip-installs on USER machines, so every
# floating requirement (`anthropic`, `faster-whisper`, and the entire
# transitive tree) can resolve differently from what was tested the day
# before — the "cap pip<25" incident was this failure mode. The output
# of this workflow gets committed as backend/constraints-{cpu,mac}.txt
# and passed via `-c` at install time, making user installs reproduce a
# resolution that CI actually performed.
#
# Refreshing the pins is a deliberate act: dispatch this workflow, copy
# the two blocks into the constraints files, land it as a normal PR.
name: Freeze Dependencies

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  freeze:
    name: Resolve (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: cpu
            reqs: backend/requirements-cpu.txt
          - os: macos-14
            label: mac
            reqs: backend/requirements-mac.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The same interpreter the bootstrap insists on for users.
          python-version: '3.12'
      - name: Install exactly as the bootstrap does
        shell: bash
        # Mirrors lib.rs::bootstrap_app_venv: binary wheels only, same
        # pip version range enforcement as the bootstrap's step 2.
        run: |
          python -m pip install --disable-pip-version-check "pip<25"
          python -m pip install --only-binary=:all: \
            --no-binary antlr4-python3-runtime,docopt -r "${{ matrix.reqs }}"
      - name: Emit the resolved pin set
        shell: bash
        run: |
          echo "===CONSTRAINTS-${{ matrix.label }}-BEGIN==="
          python -m pip freeze --exclude pip --exclude setuptools --exclude wheel
          echo "===CONSTRAINTS-${{ matrix.label }}-END==="
          python -m pip freeze --exclude pip --exclude setuptools --exclude wheel \
            > "constraints-${{ matrix.label }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: constraints-${{ matrix.label }}
          path: constraints-${{ matrix.label }}.txt

  collect:
    name: Commit the pins and open a PR
    needs: freeze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: constraints-*
          merge-multiple: true
          path: pins
      - name: Place the files with a provenance header
        shell: bash
        # The header names the run that produced the pins, so a future
        # reader can go read the resolution rather than guess at it.
        run: |
          set -eu
          for label in cpu mac; do
            src="pins/constraints-${label}.txt"
            dest="backend/constraints-${label}.txt"
            test -s "$src" || { echo "::error::$src missing or empty"; exit 1; }
            {
              echo "# GENERATED — do not hand-edit."
              echo "#"
              echo "# The full transitive pin set resolved by .github/workflows/"
              echo "# freeze-deps.yml on the platform this file targets, using the"
              echo "# same flags the bootstrap uses (lib.rs::bootstrap_app_venv)."
              echo "# The bootstrap and the venv self-repair pass it to pip via -c,"
              echo "# so a user install reproduces a resolution CI actually"
              echo "# performed rather than whatever PyPI resolves to that day."
              echo "#"
              echo "# To refresh: dispatch Freeze Dependencies; it opens a PR."
              echo "# Source run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "# Requirements: backend/requirements-${label}.txt"
              echo ""
              cat "$src"
            } > "$dest"
            echo "wrote $dest ($(grep -c '==' "$dest") pins)"
          done
      - name: Open the PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/refresh-constraints
          base: main
          commit-message: |
            Refresh dependency constraints from CI resolution

            Generated by the Freeze Dependencies workflow: each platform's
            requirements file resolved on its own runner with the
            bootstrap's exact pip flags, frozen to the full transitive
            pin set.
          title: Refresh dependency constraints from CI resolution
          body: |
            Generated by [Freeze Dependencies](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Each platform's requirements file was resolved on its own OS
            runner using the same pip flags the bootstrap uses, then frozen
            to the full transitive pin set. The bootstrap and the venv
            self-repair pass these to pip via `-c`, so user installs
            reproduce a resolution CI actually performed.

            Review the diff for unexpected major-version jumps before
            merging — this is the moment those become visible.
          delete-branch: true
