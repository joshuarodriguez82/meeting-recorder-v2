<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meeting Recorder</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      background: #fafafa;
      color: #1a1a1a;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 4px 0;
    }
    p.subtitle {
      font-size: 11px;
      color: #666;
      margin: 0 0 12px 0;
    }
    button#captureBtn {
      width: 100%;
      padding: 10px 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button#captureBtn:hover { background: #1d4ed8; }
    button#captureBtn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      display: none;
      line-height: 1.4;
    }
    #status.ok {
      background: #d1fae5;
      color: #065f46;
      display: block;
    }
    #status.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
      word-break: break-word;
    }
    #status.busy {
      background: #dbeafe;
      color: #1e40af;
      display: block;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 11px;
      color: #666;
    }
    .row a {
      color: #2563eb;
      text-decoration: none;
    }
    .row a:hover { text-decoration: underline; }
    #notConfigured {
      display: none;
      background: #fef3c7;
      color: #92400e;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Meeting Recorder</h1>
  <p class="subtitle">Capture today's Outlook calendar + Teams Activity from this Chrome.</p>

  <div id="notConfigured">
    <strong>Setup required.</strong> Open <a id="optionsLink" href="#">extension Settings</a> and paste the recorder's backend URL + auth token from Meeting Recorder Settings → Chrome Extension.
  </div>

  <button id="captureBtn">Capture &amp; Send</button>

  <div id="status"></div>
  <div id="lastCapture" style="margin-top: 8px; font-size: 11px; color: #666;"></div>
  <div id="lastCalendar" style="margin-top: 4px; font-size: 11px; color: #666; font-weight: 500;"></div>

  <div class="row">
    <span id="version">v1.19.0 · 4 sources + calendar</span>
    <a id="settingsLink" href="#">Settings &amp; schedule</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
